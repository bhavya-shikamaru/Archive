<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal - CPMS</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23059669'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/auth.js"></script>
  <script>
    if (!auth.checkAuth(['student'])) {
      
    }
  </script>
</head>
<body>
  
  <header id="navbar"></header>

  <main class="main-content">
    <div class="container">
      
      <div class="mb-6 animate-fade-in-up" style="padding-bottom: 1.5rem; border-bottom: 1px solid var(--slate-200);">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div>
            <p style="font-size: 0.75rem; font-weight: 700; color: var(--primary-600); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem;">
              Student Portal
            </p>
            <h1 id="welcomeHeading" style="font-size: 1.85rem;">Welcome, Student</h1>
            <div id="studentMeta" class="flex items-center flex-wrap gap-2 mt-2" style="font-size: 0.9rem; color: var(--slate-600);">
              <span id="metaEnrollment" style="font-weight: 700; color: var(--slate-900);">—</span>
              <span style="color: var(--slate-300);">|</span>
              <span id="metaBranch" class="badge badge-success">—</span>
              <span style="color: var(--slate-300);">|</span>
              <span id="metaCgpa" style="font-weight: 700; color: var(--primary-600);">CGPA —</span>
              <span style="color: var(--slate-300);">|</span>
              <span id="metaBacklogs" style="font-weight: 700;">— Backlogs</span>
            </div>
          </div>

          <div id="resumeStatusHeader">
            
          </div>
        </div>
      </div>

      <div class="tab-container animate-fade-in-up">
        <button type="button" class="tab-btn active" id="tabBtnDrives" onclick="switchTab('drives')">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <span>Placement Drives</span>
          <span class="tab-badge" id="badgeEligibleCount">0</span>
        </button>
        <button type="button" class="tab-btn" id="tabBtnApps" onclick="switchTab('applications')">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>My Applications</span>
          <span class="tab-badge" id="badgeAppsCount">0</span>
        </button>
        <button type="button" class="tab-btn" id="tabBtnProfile" onclick="switchTab('profile')">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span>Profile & Resume</span>
        </button>
      </div>

      <section id="tabDrives" class="animate-fade-in-up">
        
        <div class="flex items-center flex-wrap gap-3 mb-4 pb-4" style="border-bottom: 1px solid var(--slate-200);">
          <div class="input-with-icon flex-1" style="min-width: 240px;">
            <span class="input-icon-left">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </span>
            <input type="text" id="driveSearchInput" placeholder="Search by company, role, or branch..." class="input" />
          </div>

          <div id="branchFilters" class="flex items-center gap-1 overflow-x-auto pb-1">
            
          </div>

          <div style="min-width: 170px;">
            <select id="driveSortSelect" class="input" style="cursor: pointer;">
              <option value="newest">Newest First</option>
              <option value="package_high">Package: High to Low</option>
              <option value="package_low">Package: Low to High</option>
              <option value="deadline">Deadline: Soonest</option>
            </select>
          </div>
        </div>

        <div class="flex items-center justify-between mb-4" style="font-size: 0.8rem; color: var(--slate-500);">
          <span id="drivesSummaryText">Loading drives...</span>
          <span id="drivesEligibleNotice" style="font-weight: 700; color: var(--primary-600);"></span>
        </div>

        <div id="drivesGrid" class="grid grid-cols-2 gap-4">
          
        </div>
      </section>

      <section id="tabApplications" class="animate-fade-in-up" style="display: none;">
        <div id="applicationsList" style="display: flex; flex-direction: column; gap: 1rem;">
          
        </div>
      </section>

      <section id="tabProfile" class="animate-fade-in-up" style="display: none;">
        <div class="grid grid-cols-3 gap-6">
          
          <div class="card" style="grid-column: span 2;">
            <h3 class="mb-4">Academic Profile</h3>
            <form id="profileForm">
              <div class="grid grid-cols-2 gap-4">
                <div class="form-group">
                  <label class="label" for="profName">Full Name</label>
                  <input type="text" id="profName" required class="input" />
                </div>
                <div class="form-group">
                  <label class="label" for="profEnrollment">Enrollment No (Read-only)</label>
                  <input type="text" id="profEnrollment" disabled class="input" />
                </div>
              </div>

              <div class="grid grid-cols-3 gap-4">
                <div class="form-group">
                  <label class="label" for="profBranch">Branch</label>
                  <select id="profBranch" class="input">
                    <option value="CSE">CSE</option>
                    <option value="IT">IT</option>
                    <option value="ECE">ECE</option>
                    <option value="EE">EE</option>
                    <option value="MECH">MECH</option>
                    <option value="CIVIL">CIVIL</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="label" for="profCgpa">CGPA</label>
                  <input type="number" id="profCgpa" step="0.01" min="0" max="10" required class="input" />
                </div>
                <div class="form-group">
                  <label class="label" for="profBacklogs">Active Backlogs</label>
                  <input type="number" id="profBacklogs" min="0" required class="input" />
                </div>
              </div>

              <div class="form-group">
                <label class="label" for="profSkills">Technical Skills</label>
                <textarea id="profSkills" rows="3" placeholder="JavaScript, HTML, CSS, Express, MySQL, Python, Git..." class="input"></textarea>
              </div>

              <button type="submit" id="saveProfileBtn" class="btn btn-primary">
                Save Profile Changes
              </button>
            </form>
          </div>

          <div class="card flex flex-col justify-between">
            <div>
              <h3 class="mb-1">Resume Document</h3>
              <p style="font-size: 0.8rem; color: var(--slate-500); line-height: 1.5; margin-bottom: 1.25rem;">
                Upload your latest CV as a PDF (max 5MB). Visible to all recruiters who review your application.
              </p>

              <div id="resumeStatusBox" class="mb-4">
                
              </div>
            </div>

            <div>
              <label for="resumeFileInput" style="cursor: pointer; display: block;">
                <input type="file" id="resumeFileInput" accept="application/pdf" style="display: none;" />
                <div style="border: 2px dashed var(--slate-300); border-radius: var(--radius-md); padding: 1.75rem 1rem; text-align: center; background: var(--slate-50); transition: all 0.15s ease;" onmouseover="this.style.borderColor='var(--primary-400)';this.style.background='var(--primary-50)';" onmouseout="this.style.borderColor='var(--slate-300)';this.style.background='var(--slate-50)';">
                  <svg id="uploadIcon" width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="margin: 0 auto 0.5rem; color: var(--slate-400);">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                  </svg>
                  <span id="uploadStatusText" style="display: block; font-size: 0.85rem; font-weight: 700; color: var(--slate-700);">
                    Click to Upload PDF Resume
                  </span>
                  <span style="display: block; font-size: 0.72rem; color: var(--slate-400); margin-top: 0.25rem;">
                    Only .pdf format · Max 5 MB
                  </span>
                </div>
              </label>
            </div>
          </div>

        </div>
      </section>

    </div>
  </main>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
