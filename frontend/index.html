<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPMS - College Placement Management System</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23059669'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/auth.js"></script>
  <script>
    (function() {
      const user = auth.getUser();
      const token = auth.getToken();
      if (!token || !user) {
        window.location.replace('login.html');
      } else if (user.role === 'admin') {
        window.location.replace('admin.html');
      } else if (user.role === 'company') {
        window.location.replace('company.html');
      } else {
        window.location.replace('student.html');
      }
    })();
  </script>
</head>
<body style="display:flex;align-items:center;justify-content:center;height:100vh;">
  <div style="text-align:center;">
    <div class="skeleton" style="width:48px;height:48px;border-radius:50%;margin:0 auto 16px;"></div>
    <p style="color:var(--slate-500);font-weight:600;">Redirecting to CPMS Portal...</p>
  </div>
</body>
</html>
